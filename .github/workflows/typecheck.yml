name: typecheck

# The type check, from spec S0062-deal-sentinel-ci-gate, as its OWN check run.
#
# It is a separate workflow rather than a second job in `test.yml` for one
# reason: the check run is what a reader sees on a pull request, and a type error
# and a test failure being distinguishable without opening a log is the whole
# point of reporting them apart. Nothing here depends on the test job and nothing
# there depends on this, so a red suite still tells you whether the tree
# type-checks.
#
# This repository compiles nothing: `tsconfig.json` sets `noEmit` and Node runs
# the TypeScript sources directly by stripping types. `tsc --noEmit` is therefore
# the ONLY thing standing between a type error and a runtime crash on the
# homelab, which is why it is a required context rather than an advisory one.
#
# Every `uses:` below is a 40-character commit SHA with its human-readable
# release beside it, per the umbrella's pinning-conventions P3.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0

      - name: Install exactly what the lockfile already names
        run: pnpm install --frozen-lockfile

      - name: Type-check every source and test file the tsconfig includes
        run: pnpm run typecheck
